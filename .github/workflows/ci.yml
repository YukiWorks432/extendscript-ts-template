name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node.js 24
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        # pnpm/setup resolves the range to the latest release; keep its version
        # check from switching to the lockfile's resolved pnpm version.
        env:
          pnpm_config_pm_on_fail: ignore
        with:
          runtime: node@24
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build all applications
        run: pnpm build --all

      - name: Check formatting
        run: pnpm fmt:check

      - name: Check diff
        run: git diff --check
