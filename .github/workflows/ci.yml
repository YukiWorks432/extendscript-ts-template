name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          install: false
          cache: true

      - name: Verify tool versions
        run: |
          pnpm_version="$(pnpm --version)"
          pnpm_major="${pnpm_version%%.*}"
          if [ "$pnpm_major" != "12" ]; then
            echo "Expected pnpm 12.x, got $pnpm_version" >&2
            exit 1
          fi
          node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build all applications
        run: pnpm build --all

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Check diff
        run: git diff --check
