name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 更新するバージョンの区分
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      notes:
        description: リリースノート本文。省略した場合は既定の説明を使います。
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Verify workflow was started on main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "release workflow は main から実行してください。" >&2
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Determine release settings
        id: settings
        env:
          MANUAL_BUMP: ${{ inputs.bump }}
          MANUAL_NOTES: ${{ inputs.notes }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const outputPath = process.env.GITHUB_OUTPUT;
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const bump = process.env.MANUAL_BUMP;
          const validBumps = ["major", "minor", "patch"];

          if (!validBumps.includes(bump)) {
            throw new Error(`Unsupported bump type: ${bump}`);
          }

          const notes = process.env.MANUAL_NOTES || "手動実行によるリリースです。";
          fs.appendFileSync(outputPath, `bump=${bump}\n`);
          fs.writeFileSync("release-notes.md", notes);
          fs.appendFileSync(summaryPath, `bump: ${bump}\n`);
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bump package version
        id: version
        env:
          BUMP: ${{ steps.settings.outputs.bump }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const bump = process.env.BUMP;
          const outputPath = process.env.GITHUB_OUTPUT;
          const packagePath = "package.json";
          const pkg = JSON.parse(fs.readFileSync(packagePath, "utf8"));
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(pkg.version);

          if (!match) {
            throw new Error(`Unsupported package version: ${pkg.version}`);
          }

          let major = Number(match[1]);
          let minor = Number(match[2]);
          let patch = Number(match[3]);

          if (bump === "major") {
            major += 1;
            minor = 0;
            patch = 0;
          } else if (bump === "minor") {
            minor += 1;
            patch = 0;
          } else if (bump === "patch") {
            patch += 1;
          } else {
            throw new Error(`Unsupported bump type: ${bump}`);
          }

          const nextVersion = `${major}.${minor}.${patch}`;
          pkg.version = nextVersion;
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);
          fs.appendFileSync(outputPath, `version=${nextVersion}\n`);
          fs.appendFileSync(outputPath, `tag=v${nextVersion}\n`);
          NODE

      - name: Verify tag does not exist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags origin
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi

      - name: Commit version and create local tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: v${VERSION} をリリース"
          git tag -a "$TAG" -m "$TAG"

      - name: Push release commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git push origin HEAD:main
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file release-notes.md
